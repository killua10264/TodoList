<!--
  Toast container — hai vùng aria-live riêng biệt:
  • polite   → success, info (không gián đoạn screen reader)
  • assertive → error, warning (đọc ngay lập tức)
-->
<div class="toast-container" aria-label="Thông báo hệ thống">

  <!-- Polite region (success + info) -->
  <div
    class="toast-region"
    aria-live="polite"
    aria-relevant="additions"
    aria-atomic="false"
  >
    @for (toast of politeToasts(); track toast.id) {
      <div
        class="toast"
        [class]="'toast-' + toast.type"
        role="status"
      >
        <!-- Icon theo loại — aria-hidden vì đã có text -->
        <span class="toast-icon" aria-hidden="true">
          @if (toast.type === 'success') {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          } @else {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          }
        </span>

        <span class="toast-text">{{ toast.text }}</span>

        <button
          class="toast-close"
          type="button"
          [attr.aria-label]="'Đóng thông báo: ' + toast.text"
          (click)="toastService.remove(toast.id)"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    }
  </div>

  <!-- Assertive region (error + warning) -->
  <div
    class="toast-region"
    aria-live="assertive"
    aria-relevant="additions"
    aria-atomic="false"
  >
    @for (toast of assertiveToasts(); track toast.id) {
      <div
        class="toast"
        [class]="'toast-' + toast.type"
        role="alert"
      >
        <span class="toast-icon" aria-hidden="true">
          @if (toast.type === 'error') {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="15" y1="9" x2="9" y2="15"/>
              <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
          } @else {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          }
        </span>

        <span class="toast-text">{{ toast.text }}</span>

        <button
          class="toast-close"
          type="button"
          [attr.aria-label]="'Đóng thông báo: ' + toast.text"
          (click)="toastService.remove(toast.id)"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    }
  </div>

</div>
